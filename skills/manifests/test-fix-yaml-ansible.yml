skill: test-fix-yaml-ansible
description: >
  Repair a failing or incorrect Molecule scenario in an Ansible role — a
  verify assertion that fails for the wrong reason, a scenario that breaks on
  an older ansible-core, or a stub that hides behaviour. Use when a role test
  is red and the role itself may be correct.
references:
