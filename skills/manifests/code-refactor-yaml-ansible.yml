skill: code-refactor-yaml-ansible
description: >
  Restructure an Ansible role without changing behaviour — split task files,
  rename internal variables, replace command/shell with modules. Use when
  asked to clean up or reorganise a role; Molecule must be green before and
  after.
references:
  - universal/procedures/code-refactor.adoc
  - ansible/conventions/general.adoc
  - ansible/conventions/yaml.adoc
  - ansible/conventions/ansible.adoc
  - ansible/conventions/molecule.adoc
  - ansible/execution/run-molecule.adoc
  - ansible/execution/run-lint.adoc
  - ansible/execution/run-pre-commit.adoc
